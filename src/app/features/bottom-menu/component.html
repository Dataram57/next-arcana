<div
    class="container"
    [class.collapsed]="collapsed"
    [style.--collapsed-height.px]="collapsedHeight"
>
    <nav>
        <button 
        class="toggle-btn"
        (click)="toggleMenu()"
    
        >
            {{ collapsed ? '▲' : '▼' }}
        </button>
    </nav>
    <div class="menu-body">
        <ng-content></ng-content>
    </div>
</div>
