
<popup-screen
    [visible]="isCardSelectOpen"
    title="Welcome"
    (close)="closePopup()"
>
    <div>
        <button class="popup-close-button" (click)="closePopup();">Close</button>
        <card-selector
            [cards]="selectedDeck?.cards ?? []"
            (onchange)='audioPlayer.play("CardChange")'
            (onselect)="clickSelectCard($event)"
        />
    </div>
</popup-screen>


<reflection-board class="reflection-board"
    [decks]="tarotDecks"
    (onpick)='audioPlayer.play("CardSelect")'
    (ondrag)='0'
    (onput)='audioPlayer.play("CardSelect")'
/>

<bottom-menu>
    <div class="card-panel">
        <a *ngFor="let deck of tarotDecks"
            href=""
            (click)="clickDeck(deck); $event.preventDefault()"
        >
            <deck [deck]="deck"/>
        </a>
    </div>
    <button
        (click)="predictFuture();"
    >
        Predict Future
    </button>
</bottom-menu>
